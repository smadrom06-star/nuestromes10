<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Felices 10 meses!</title>
    <!-- Fuentes hermosas de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffffff, #ffe6e6, #ffb3b3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Quicksand', sans-serif;
            color: #2b2b2b;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Corazones cayendo */
        .decoracion-corazon {
            position: absolute;
            color: #ff4d4d;
            font-size: 24px;
            z-index: 0;
            opacity: 0.7;
            animation: flotarEstatico 4s ease-in-out infinite alternate;
        }

        @keyframes flotarEstatico {
            0% {
                transform: translateY(0) scale(1);
            }

            100% {
                transform: translateY(-15px) scale(1.1);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 25px;
            max-width: 85%;
            width: 340px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(217, 83, 79, 0.25);
            border: 2px solid #ffccd5;
        }

        h1 {
            color: #cc0029;
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            margin: 0 0 10px 0;
        }

        .frase {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #4a4a4a;
        }

        /* Contenedor de la foto redondo y seguro */
        .foto-marco {
            width: 180px;
            height: 180px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 4px solid #ff4d4d;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .foto {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detalles-amor {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        /* Flork cargado desde un sitio seguro */
        .flork {
            width: 110px;
            height: auto;
            margin-top: 5px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <!-- Corazones de fondo distribuidos -->
    <div class="decoracion-corazon" style="top: 10%; left: 8%;">❤️</div>
    <div class="decoracion-corazon" style="top: 15%; right: 10%; animation-delay: 1s;">💖</div>
    <div class="decoracion-corazon" style="bottom: 12%; left: 12%; animation-delay: 0.5s;">💕</div>
    <div class="decoracion-corazon" style="bottom: 15%; right: 8%; animation-delay: 1.5s;">❤️</div>

    <div class="container">
        <h1>¡Felices 10 meses, mi amor!</h1>

        <p class="frase">
            "Cada día a tu lado es un regalo. Gracias por estos 10 meses llenos de risas, apoyo y un amor tan bonito. ¡Por muchísimos más! Te amo."
        </p>

        <!-- Marco redondo para la foto -->
        <div class="foto-marco">
            <!-- AQUÍ PUSE TU ENLACE DIRECTO NUEVO -->
            <img class="foto" src="https://i.postimg.cc/xjpV99zR/Whats-App-Image-2026-08-10-at-7-29-13-PM.jpg" alt="Nuestra Foto">
        </div>

        <div class="detalles-amor">❤️❤️❤️</div>

        <!-- Flork Enamorado -->
        <img class="flork" src="https://openclipart.org/image/400px/338271" alt="Amor">
    </div>

</body>
</html>
